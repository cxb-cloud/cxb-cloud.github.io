<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Zine Imposition Engine</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://jsdelivr.net"></script>
    <!-- pdf-lib for parsing and high-fidelity PDF synthesis -->
    <script src="https://unpkg.com"></script>
    <!-- PDF.js for rendering vector views into browser canvas elements -->
    <script src="https://cloudflare.com"></script>
    <style>
        .drop-over { border-color: #3b82f6; background-color: #eff6ff; }
        .ghost { opacity: 0.4; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800 p-4 sm:p-8 font-sans">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-tight text-gray-900">Zine Imposition Engine</h1>
                <p class="text-sm text-gray-500 mt-1">Compile layouts with automated crop marks, folding guides, and signature tracking entirely in-browser.</p>
            </div>
            <div id="globalStatus" class="hidden text-xs bg-blue-50 text-blue-700 px-3 py-1.5 rounded-full font-medium border border-blue-100 items-center gap-2">
                <span class="animate-ping inline-flex h-2 w-2 rounded-full bg-blue-400"></span>
                <span id="statusMessage">Ready</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Panel: Controls & Options -->
            <div class="space-y-6 lg:col-span-1">
                
                <!-- 1. Input Sources -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400 flex items-center gap-2">
                        <span>1. Data Ingestion</span>
                    </h2>
                    
                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-200 text-xs space-y-2">
                        <span class="block font-semibold text-gray-600">Source Formatting:</span>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="splitLengthwise" class="rounded text-blue-600 focus:ring-blue-500">
                            <span>Split spreads/pages down the middle</span>
                        </label>
                    </div>

                    <div id="dropZone" class="border-2 border-dashed border-gray-200 rounded-xl p-6 text-center cursor-pointer hover:border-blue-400 hover:bg-gray-50 transition flex flex-col items-center justify-center min-h-[140px]">
                        <svg class="w-8 h-8 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        <p class="text-xs font-semibold text-gray-700">Drop PDF or Raw Images</p>
                        <p class="text-[10px] text-gray-400 mt-0.5">Appends cleanly into asset index</p>
                        <input type="file" id="fileInput" accept=".pdf,image/*" multiple class="hidden">
                    </div>
                </div>

                <!-- 2. Target Arrangement Blueprint -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400">2. Layout Blueprint</h2>
                    
                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-gray-600">Layout Format Type:</label>
                        <select id="zineType" class="w-full text-sm bg-gray-50 border border-gray-200 rounded-xl p-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <option value="8page_single">8-Page Micro Zine (Single-Sided + Center Cut)</option>
                            <option value="16page_single">16-Page Accordion/Folded Mini Zine (Single-Sided)</option>
                            <option value="booklet_4page">4-Page Booklet Folio Signature (Double-Sided)</option>
                            <option value="booklet_12page">12-Page Booklet Signature (3 Double-Sided Sheets)</option>
                            <option value="booklet_32page">32-Page Large Booklet Signature (8 Double-Sided Sheets)</option>
                            <option value="6page_accordion">6-Page Accordion Tri-Fold Layout</option>
                            <option value="raw_split">Raw Independent Splits Only (No Alignment Transformation)</option>
                        </select>
                    </div>

                    <div id="foldingInstructions" class="bg-amber-50/70 border border-amber-200 p-3.5 rounded-xl text-xs text-amber-900 space-y-1.5">
                        <!-- Swapped dynamically by JS -->
                    </div>
                </div>

                <!-- 3. Print Guide Settings -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400">3. Print Guides</h2>
                    <div class="space-y-2 text-xs">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="drawFoldLines" checked class="rounded text-blue-600 focus:ring-blue-500">
                            <span>Draw dashed fold guides</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="drawCutLines" checked class="rounded text-blue-600 focus:ring-blue-500">
                            <span>Draw solid cut/crop lines</span>
                        </label>
                    </div>
                </div>

                <!-- 4. Generation Pipeline -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-gray-400">4. Compile Output</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <button id="btnExportPdf" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer">
                            Export Print PDF
                        </button>
                        <button id="btnExportImages" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold text-xs py-2.5 px-4 rounded-xl shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer">
                            Export Sheet Image
                        </button>
                    </div>
                </div>

            </div>

            <!-- Right Panel: Visual Workbench -->
            <div class="lg:col-span-2">
                <!-- Visual workbench contents here -->
            </div>
        </div>
    </div>

</body>
</html>
